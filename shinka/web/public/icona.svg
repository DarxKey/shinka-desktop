<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a8c"/>
      <stop offset="0.65" stop-color="#3f78d6"/>
      <stop offset="1" stop-color="#7db4ee"/>
    </linearGradient>
    <linearGradient id="foglia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#8cc4f2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>

  <!-- Fiocchi che cadono. -->
  <g fill="#ffffff">
    <circle cx="60" cy="150" r="7" opacity="0.9"/>
    <circle cx="140" cy="170" r="5" opacity="0.7"/>
    <circle cx="60" cy="250" r="6" opacity="0.6"/>
    <circle cx="430" cy="210" r="6" opacity="0.8"/>
    <circle cx="468" cy="300" r="5" opacity="0.6"/>
    <circle cx="350" cy="60" r="5" opacity="0.7"/>
    <circle cx="200" cy="52" r="4" opacity="0.6"/>
    <circle cx="96" cy="340" r="4" opacity="0.5"/>
  </g>
  <!-- Due cristalli a sei braccia. -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <g transform="translate(112 98)">
      <path d="M0 -26 V26 M-22.5 -13 L22.5 13 M-22.5 13 L22.5 -13"/>
    </g>
    <g transform="translate(420 112) scale(0.75)" opacity="0.9">
      <path d="M0 -26 V26 M-22.5 -13 L22.5 13 M-22.5 13 L22.5 -13"/>
    </g>
  </g>

  <!-- Shinka vuol dire evoluzione: un germoglio che sale, anche sotto la neve. -->
  <g>
    <path d="M256 424 C252 360 250 312 256 262" fill="none" stroke="#e6f4ff" stroke-width="30" stroke-linecap="round"/>
    <path d="M254 330 C204 334 160 308 148 252 C204 244 246 274 254 330 Z" fill="url(#foglia)"/>
    <path d="M241 276 C246 182 312 120 396 110 C402 204 336 270 241 276 Z" fill="url(#foglia)"/>
    <!-- Neve sulla foglia grande. -->
    <path d="M300 148 C330 124 364 112 396 110 C398 128 396 146 390 162 C378 150 366 156 356 168 C346 154 330 150 318 160 C312 150 306 148 300 148 Z" fill="#ffffff"/>
  </g>

  <!-- Il mucchio di neve. -->
  <path d="M0 440 C90 400 180 412 256 428 C340 412 430 400 512 440 V512 H0 Z" fill="#ffffff"/>
  <path d="M0 470 C100 450 200 462 256 470 C330 458 430 452 512 474 V512 H0 Z" fill="#dcecff"/>
</svg>
