<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06021a"/>
      <stop offset="1" stop-color="#25073f"/>
    </linearGradient>
    <radialGradient id="bagliore" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#7a1fd6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#06021a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ciano" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7df9ff"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <pattern id="griglia" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff2bd6" stroke-opacity="0.13"/>
    </pattern>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="largo"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="stretto"/>
      <feMerge><feMergeNode in="largo"/><feMergeNode in="stretto"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Il germoglio: stelo spezzato e foglie a facce, la metà in luce ciano e quella in ombra magenta. -->
    <g id="germoglio">
      <path d="M248 414 L242 338 L248 262" fill="none" stroke="#00f0ff" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M246 318 L190 312 L132 240 Z" fill="url(#ciano)"/>
      <path d="M246 318 L132 240 L200 246 Z" fill="url(#magenta)"/>
      <path d="M232 270 L250 196 L302 138 L380 102 Z" fill="url(#ciano)"/>
      <path d="M232 270 L380 102 L366 176 L320 232 Z" fill="url(#magenta)"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <rect width="512" height="512" fill="url(#griglia)"/>
  <rect width="512" height="512" fill="url(#bagliore)"/>
  <!-- Il glitch: due copie sfasate, una magenta a sinistra e una ciano a destra. -->
  <use href="#germoglio" transform="translate(-9 0)" opacity="0.45" style="mix-blend-mode:screen" filter="url(#neon)"/>
  <use href="#germoglio" transform="translate(9 3)" opacity="0.35" style="mix-blend-mode:screen"/>
  <use href="#germoglio" filter="url(#neon)"/>
  <!-- Il circuito sulla nervatura della foglia grande, e le fette spostate del glitch. -->
  <path d="M238 262 L292 206 H326 L362 168" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square"/>
  <rect x="356" y="162" width="12" height="12" fill="#ffffff"/>
  <path d="M292 206 L306 232" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="302" y="230" width="8" height="8" fill="#00f0ff"/>
  <rect x="150" y="226" width="64" height="7" fill="#00f0ff" opacity="0.85"/>
  <rect x="312" y="118" width="88" height="5" fill="#ff2bd6" opacity="0.9"/>
  <rect x="218" y="352" width="40" height="5" fill="#ff2bd6" opacity="0.8"/>
</svg>
